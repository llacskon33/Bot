name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: unzip -o CoachBrawl-proyecto-android.zip
      - run: cd CoachBrawl && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coach-brawl-apk
          path: CoachBrawl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Coach Brawl APK
          body: Descarga el APK desde la sección Assets.
          make_latest: true
          files: CoachBrawl/app/build/outputs/apk/debug/app-debug.apk
